name: Release Client - Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          target: 'desktop'
          cache: true

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libssl-dev
          
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          sudo mv linuxdeployqt-continuous-x86_64.AppImage /usr/local/bin/linuxdeployqt

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S ClientPart -B ClientPart/build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ClientPart/build --config Release --parallel

      - name: Package Linux
        shell: bash
        run: |
          dist="release_pkg"
          mkdir -p "$dist"
          
          exe_path=$(find ClientPart/build -type f -name "Client" -executable | head -n 1)
          if [ -z "$exe_path" ]; then echo "Client binary not found!"; exit 1; fi
          
          cp "$exe_path" "$dist/"
          [ -f config.json ] && cp config.json "$dist/"
          chmod +x "$dist/Client"
          
          echo -e "#!/bin/bash\nDIR=\$(cd \"\$(dirname \"\$0\")\" && pwd)\nexport LD_LIBRARY_PATH=\"\$DIR/lib:\$LD_LIBRARY_PATH\"\nexec \"\$DIR/Client\"" > "$dist/run.sh"
          chmod +x "$dist/run.sh"
          
          linuxdeployqt "$dist/Client" -appimage -unsupported-allow-new-glibc || true
          tar -czf "ChatClient_Linux.tar.gz" -C "$dist" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatClient_Linux
          path: ChatClient_Linux.tar.gz

  release:
    needs: build_linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ChatClient_Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ChatClient_Linux.tar.gz
          tag_name: ${{ github.ref_name }}
          body: |
            ### Release ${{ github.ref_name }} (Linux)
            **Server:** `31.192.108.37:6767`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
